<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last signal</title>
    <link rel="icon" href="data:," />

    <link rel="stylesheet" href="src/css/style.css"/>
    <script type="module">
        import { Main } from "./src/js/Main.js";
        const app = new Main();
    </script>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div id="mainMenu" aria-label="Main menu">
        <div id="mainMenuBackdrop"></div>
        <div id="mainMenuNebula"></div>
        <div id="mainMenuPlanet"></div>
        <div id="mainMenuPanel">
            <h1>LAST SIGNAL</h1>
            <p id="mainMenuDescription">Un signal faible, des enigmes à résoudre pour avancer.</p>
            <div id="mainMenuActions">
                <button id="menuStartButton" type="button" disabled>Start</button>
                <button id="menuQuitButton" type="button">Quit</button>
            </div>
        </div>
    </div>
    <div id="endMenu" aria-label="End menu" class="hidden">
        <div id="endMenuBackdrop"></div>
        <div id="endMenuNebula"></div>
        <div id="endMenuPlanet"></div>
        <div id="endMenuPanel">
            <h1>FIN</h1>
            <p id="endMenuDescription">Bravo, tu as terminé l'aventure. Merci d'avoir joué !</p>
            <p id="endMenuCredits">Réalisé par Mathis Andre et Marc Di Russo.</p>
            <div id="endMenuActions">
                <button id="endMenuQuitButton" type="button">Quit</button>
            </div>
        </div>
    </div>
    <div id="crosshair"></div>
    <div id="dialogCrosshair">talk &lt; E &gt;</div>
    <div id="interactCrosshair">interact &lt; E &gt;</div>
    <div id="respawnOverlay"></div>
    <div id="dialogBox"></div>
    <div id="tipsOverlay"></div>
</body>

</html>
